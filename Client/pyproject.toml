[project]
name = "kvm-card-mini-client"
version = "0.1.0"
description = "USB KVM Card Mini desktop client"
requires-python = ">=3.10,<3.14"
dependencies = [
    "blinker==1.9.0",
    "click==8.2.1",
    "colorama==0.4.6",
    "darkdetect==0.7.1",
    "Flask==3.1.1",
    "flask-cors==6.0.1",
    "Flask-HTTPAuth==4.8.0",
    "flask-sock==0.7.0",
    "h11==0.16.0",
    "hidapi==0.14.0.post4",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "loguru==0.7.3",
    "MarkupSafe==3.0.2",
    "pyqtdarktheme==2.1.0",
    "PySide6==6.9.1",
    "PySide6_Addons==6.9.1",
    "PySide6_Essentials==6.9.1",
    "PyYAML==6.0.2",
    "setuptools==80.9.0",
    "shiboken6==6.9.1",
    "simple-websocket==1.1.0",
    "Werkzeug==3.1.3",
    "wsproto==1.2.0",
    "pywin32==311 ; sys_platform == 'win32'",
    "pyWinhook==1.6.2 ; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "win32_setctime==1.2.0 ; sys_platform == 'win32'",
]

[dependency-groups]
packaging = [
    "nuitka>=2.7.12",
    "ordered-set>=2.0.0",
    "zstandard>=0.23.0",
]

[tool.uv]
package = false

# Upstream metadata claims python<3.12; the wheel still imports on 3.12/3.13.
[[tool.uv.dependency-metadata]]
name = "pyqtdarktheme"
version = "2.1.0"
requires-dist = ["darkdetect"]
requires-python = ">=3.7"
